<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Valentine Quest Portal</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            /**body { background-color: #0f0a19; margin: 0; overflow: hidden; }**/
            .glow-card { border: 1px solid rgba(236, 72, 153, 0.2); transition: all 0.3s ease; }
            .glow-card:hover { border-color: rgba(236, 72, 153, 0.6); box-shadow: 0 0 20px rgba(236, 72, 153, 0.1); }
            /**body { background-color: #0f0a19; margin: 0; overflow: hidden; }**/ 
            body { background-color: #0f0a19; margin: 0; overflow-x: hidden; overflow-y: auto;}
    /* Optional: Make scrollbar look "Techie" */
            ::-webkit-scrollbar { width: 5px; }
            ::-webkit-scrollbar-track { background: #0f0a19; }
            ::-webkit-scrollbar-thumb { background: #332a44; border-radius: 10px; }
            ::-webkit-scrollbar-thumb:hover { background: #ec4899; }
        </style>
